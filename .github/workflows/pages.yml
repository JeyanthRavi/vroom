name: Deploy aggregate demo

on:
  push:
    branches: [main]
    paths:
      - "F1-Intelligence-Lab/public-results/**"
      - "F1-Intelligence-Lab/src/f1_intelligence_lab/site_export.py"
      - "F1-Intelligence-Lab/src/f1_intelligence_lab/static/model-demo.*"
      - "research/PROTOCOL.md"
      - "research/RESULTS.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build rights-safe aggregate site
        env:
          PYTHONPATH: F1-Intelligence-Lab/src
        run: >-
          python -m f1_intelligence_lab.site_export
          --source F1-Intelligence-Lab/public-results/aggregate-results.json
          --output _site
          --root .
      - name: Verify aggregate-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("_site")
          data = json.loads((root / "data.json").read_text())
          assert data["schema"] == 2
          assert data["export_mode"] == "aggregate"
          forbidden = {"actual", "driver", "prediction_at", "lap_number", "duration"}
          def keys(value):
              if isinstance(value, dict):
                  return {str(key).lower() for key in value} | set().union(
                      *(keys(item) for item in value.values())
                  )
              if isinstance(value, list):
                  return set().union(*(keys(item) for item in value)) if value else set()
              return set()
          assert not forbidden.intersection(keys(data))
          assert (root / "export-metadata.json").is_file()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
