name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]' -e './F1-StewardLens[dev]' -e './F1-Telemetry-Pit-Crew[f1,dev]' -e './F1-Intelligence-Lab[ml,audit,research,dev]'
      - run: make lint
      - run: make type
      - run: make docs

  test-no-torch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e './F1-StewardLens[dev]' -e './F1-Telemetry-Pit-Crew[f1,dev]' -e './F1-Intelligence-Lab[ml,audit,research,dev]'
      - run: make test

  test-with-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - run: python -m pip install -e './F1-StewardLens[dev]' -e './F1-Telemetry-Pit-Crew[f1,dev]' -e './F1-Intelligence-Lab[ml,audit,research,dev]'
      - run: make test-torch

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e './F1-StewardLens[dev]' -e './F1-Telemetry-Pit-Crew[f1,dev]' -e './F1-Intelligence-Lab[dl,audit,research,dev]'
      - run: make demo
      - run: make public-demo
      - uses: actions/upload-artifact@v4
        with:
          name: aggregate-demo-preview
          path: .build/public-demo
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f F1-Intelligence-Lab/Dockerfile -t vroom-portal .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make public-demo
      - run: docker build -f F1-Intelligence-Lab/Dockerfile.demo -t vroom-demo .

