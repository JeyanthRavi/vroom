[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vroom-workspace"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.4",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".build", "F1-Intelligence-Lab/demo-export", "F1-Intelligence-Lab/demo-export-aggregate", "F1-Intelligence-Lab/demo-export-final"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "SIM"]
ignore = ["E701", "E702"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true
no_implicit_optional = false
warn_unused_ignores = true
ignore_errors = false
exclude = "(^|/)(tests|demo-export|demo-export-aggregate|demo-export-final)/"

[[tool.mypy.overrides]]
module = ["f1_intelligence_lab.security"]
ignore_errors = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["f1_intelligence_lab.research.*"]
ignore_errors = false
check_untyped_defs = true

# Temporary, explicit legacy boundary. New modules are checked by default;
# these dynamic ingestion/training modules are migrated incrementally instead
# of hiding every mypy error repository-wide.
[[tool.mypy.overrides]]
module = [
  "f1_intelligence_lab.openf1_provider",
  "f1_intelligence_lab.historical",
  "f1_intelligence_lab.ml_prep",
  "f1_intelligence_lab.ml_dataset",
  "f1_intelligence_lab.library_api",
  "f1_intelligence_lab.ecosystem",
  "f1_intelligence_lab.race_detail",
  "f1_intelligence_lab.ml_train",
  "f1_intelligence_lab.ml_sequences",
  "f1_intelligence_lab.dl_train",
  "f1_intelligence_lab.robust_train",
  "f1_intelligence_lab.cross_season",
  "f1_intelligence_lab.export_demo",
  "telemetry_pit_crew.service",
  "stewardlens.fia_ingestion",
]
ignore_errors = true


