[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vroom-workspace"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.4",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["F1-Intelligence-Lab/demo-export", "F1-Intelligence-Lab/demo-export-aggregate", "F1-Intelligence-Lab/demo-export-final"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = false
warn_unused_ignores = true
ignore_errors = true
exclude = "(^|/)(tests|demo-export|demo-export-aggregate|demo-export-final)/"

[[tool.mypy.overrides]]
module = ["f1_intelligence_lab.security"]
ignore_errors = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["f1_intelligence_lab.research.*"]
ignore_errors = false
check_untyped_defs = true


