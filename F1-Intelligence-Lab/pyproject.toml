[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-intelligence-lab"
version = "0.1.0"
description = "Unified local portal for StewardLens and Telemetry Pit Crew"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ml = ["scikit-learn==1.6.1", "joblib>=1.2,<2", "threadpoolctl>=3.1,<4"]
dl = ["torch==2.8.0", "scikit-learn==1.6.1", "joblib>=1.2,<2", "threadpoolctl>=3.1,<4"]
audit = ["pypdf>=5,<6"]
historical = ["fastf1>=3.7,<4", "pandas>=2.2,<3"]
research = ["matplotlib>=3.9,<4", "scipy>=1.13,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1_intelligence_lab = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "../F1-StewardLens/src",
  "../F1-Telemetry-Pit-Crew/src",
]
testpaths = ["tests"]

